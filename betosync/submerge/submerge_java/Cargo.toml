handle_map.workspace = true
jni.workspace = true
log.workspace = true
parking_lot = { version = "0.12.3", features = ["arc_lock"] }
pourover.workspace = true
protobuf.workspace = true
thiserror.workspace = true

[dev-dependencies]

[lints]
workspace = true
