syntax = "proto3";

package nearby.internal;

// LINT.IfChange(visibility_level)
enum VisibilityLevel {
  VISIBILITY_LEVEL_UNSPECIFIED = 0;
  VISIBILITY_LEVEL_SELF_GROUP = 1;
  VISIBILITY_LEVEL_FAMILY_GROUP = 2;
  VISIBILITY_LEVEL_CONTACTS_GROUP = 3;
  VISIBILITY_LEVEL_PUBLIC = 4;
}
// LINT.ThenChange(nearby/identity/common/src/definitions.rs:visibility_level)

message VisibilityScope {
  VisibilityLevel level = 1;
  string provider_name = 2;
}

// The discovery credential is derived from broadcast credential, and distributed to
// remote devices based on the trust token for identity decryption and
// authentication.
// NEXT_ID=13
message DiscoveryCredential {
  // The randomly generated positive unique id of the discovery credential.
  int64 id = 1;

  // 32 bytes of secure random bytes used to derive any symmetric keys needed.
  bytes key_seed = 2;

  // The time in millis from epoch when this credential becomes effective.
  int64 start_time_millis = 3;

  // The time in millis from epoch when this credential expires.
  int64 end_time_millis = 4;

  // The encrypted Metadata in bytes. Encrypted by the v0 identity token.
  bytes encrypted_metadata_bytes_v0 = 5;

  // The encrypted Metadata in bytes. Encrypted by the v1 identity token.
  bytes encrypted_metadata_bytes_v1 = 6;

  // The HMAC of the plaintext identity token included (in encrypted form) in a
  // V0 advertisement.
  bytes identity_token_hmac_key_v0 = 7;

  // The HMAC of the plaintext identity token included (in encrypted form) in an
  // unsigned, short salt, V1 advertisement.
  bytes identity_token_short_salt_adv_hmac_key_v1 = 8;

  // The HMAC of the plaintext identity token included (in encrypted form) in an
  // unsigned, extended salt, V1 advertisement.
  bytes identity_token_extended_salt_adv_hmac_key_v1 = 9;

  // The public key is used to create a secure connection with the device.
  bytes connection_signature_verification_key = 10;

  // The visibility scope assigned to the credential.
  VisibilityScope visibility_scope = 11;

  // Credential version used to infer the expected credential material.
  int64 credential_version = 12;
}
