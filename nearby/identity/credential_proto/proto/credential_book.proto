syntax = "proto3";

package nearby.internal;

import "credential.proto";
import "broadcast_credential.proto";


// Represents a book containing local broadcast & converted discovery credentials on the local device.
// NEXT_ID=2
message LocalCredentialBook {
  // Local credentials keyed by IdentityType enum values.
  map<int32, BroadcastCredentials> local_credentials = 1;

}

message BroadcastCredentials {
  // Broadcast credentials for the local device.
  repeated BroadcastCredential broadcast_credentials = 1;

  // Discovery credential converted from broadcast credential. Belongs to local device
  // and should only be used for uploading to an identity provider server.
  repeated DiscoveryCredential converted_discovery_credentials = 2;
}

// Represents a book containing remote discovery credentials on the local device.
// NEXT_ID=3
message RemoteCredentialBook {
  // Discovery credentials generated from account based identity broadcast credentials.
  repeated DiscoveryCredential self_remote_credentials = 1;

  // Discovery credentials generated from contact based identity broadcast credentials.
  repeated DiscoveryCredential contacts_remote_credentials = 2;
}

// Represents a collection of consumed salts for a single broadcast credential.
// NEXT_ID=2
message ConsumedSalts {

  // The list of consumed salt values.
  repeated bytes salt = 1;
}

// Represents a book containing all consumed salts for all broadcast
// credentials.
// NEXT_ID=2
message ConsumedSaltsBook {

  // A map from a broadcast credential's key seed to its consumed salts.
  map<uint32, ConsumedSalts> consumed_salts_map = 1;
}
