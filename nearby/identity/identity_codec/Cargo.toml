[package]
name = "identity_codec"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
common.workspace = true
async-trait = "0.1.77"
identity_common.workspace = true
identity_manager = { path = "../identity_manager" }
crypto_provider = { path = "../../crypto/crypto_provider" }
up_adv = { workspace = true, features = ["std"] }
np_hkdf.workspace = true
device_info.workspace = true
serde_json = { workspace = true, features = ["std"] }
base64.workspace = true
mockall.workspace = true
log.workspace = true
protobuf = "3.7.2"
tokio = { workspace = true, features = ["full"] }
storage.workspace = true

# Dependencies behind `encrypted_identity` feature.
credential_proto = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
ldt_np_adv = { workspace = true, optional = true }

[dev-dependencies]
rstest = "0.25.0"
serial_test = "2.0.0"
crypto_provider_default = { path = "../../crypto/crypto_provider_default", features = ["std", "rustcrypto"] }
crypto_provider = { path = "../../crypto/crypto_provider", features = ["test_vectors"] }
tokio = { workspace = true }
ldt_np_adv = { workspace = true }
tempfile = "3.10.1"
storage = { workspace = true, features = ["test-fake"] }
hex-literal.workspace = true
identity_provider = { workspace = true, features = ["test-utils"] }
keystore = { path = "../keystore" }

[lints]
workspace = true

[features]
default = []
encrypted_identity = [
    "identity_manager/encrypted_identity",
    "credential_proto",
    "chrono",
    "ldt_np_adv",
]
test-utils = []
