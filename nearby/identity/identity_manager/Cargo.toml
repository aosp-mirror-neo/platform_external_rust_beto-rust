[package]
name = "identity_manager"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
async-trait = "0.1.77"
identity_common.workspace = true
crypto_provider = { path = "../../crypto/crypto_provider", features = ["raw_private_key_permit", "std"] }
up_adv = { workspace = true, features = ["std"] }
np_hkdf.workspace = true
device_info.workspace = true
serde_json = { workspace = true, features = ["std"] }
mockall.workspace = true
log.workspace = true
protobuf = "3.7.2"
tokio = { workspace = true, features = ["full"] }
storage.workspace = true
identity_provider = { workspace = true }

# Dependencies behind `encrypted_identity` feature.
credential_proto = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
ldt_np_adv = { workspace = true, optional = true }
arc-swap = { version = "1.7.1", optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
rstest = "0.25.0"
serial_test = "2.0.0"
crypto_provider_default = { path = "../../crypto/crypto_provider_default", features = ["std", "rustcrypto"] }
crypto_provider = { path = "../../crypto/crypto_provider", features = ["test_vectors"] }
tokio = { workspace = true }
ldt_np_adv = { workspace = true }
tempfile = "3.10.1"
storage = { workspace = true, features = ["test-fake"] }
hex-literal.workspace = true

[lints]
workspace = true

[features]
default = []
# This feature is an internal implementation detail.
# It is used to enable code that handles raw private keys, which is a sensitive operation.
# It should not be enabled directly by consumers of this crate.
raw_private_key_permit = []
test-utils = []
encrypted_identity = [
    "credential_proto",
    "chrono",
    "ldt_np_adv",
    "arc-swap",
    "futures",
    "raw_private_key_permit"
]
