# TODO: Add to CI
[workspace]
resolver = "2"
members = ["lib", "jni", "tools/generate_token"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_extern_crates = "deny"
unused_import_braces = "deny"
unused_results = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(fuzzing)',
  'cfg(rust_analyzer)',
] }
unsafe_op_in_unsafe_fn = "forbid"

[workspace.lints.clippy]
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
indexing_slicing = "deny"
missing_safety_doc = "deny"            # This should really be "forbid", but some macros are not compatible
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"    # This should really be "forbid", but some macros are not compatible
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unwrap_used = "deny"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22.1"
clap = { version = "4.5", features = ["derive"] }
coset = "0.3.8"
ed25519-dalek = { version = "2.1.1", features = ["pem", "pkcs8", "rand_core"] }
hex = "0.4"
jni = "0.21.1"
lazy_static = "1.5.0"
rand = "0.9.1"
rand_core_06 = { package = "rand_core", version = "0.6.4", features = ["std"] }
sha2 = "0.10.8"
thiserror = "2.0.17"

crypto_provider = { path = "../nearby/crypto/crypto_provider", features = ["std"] }
crypto_provider_default = { path = "../nearby/crypto/crypto_provider_default", features=["std"] }
handle_map = { path = "../common/handle_map" }
lock_adapter = { path = "../common/lock_adapter" }
pourover = { path = "../common/pourover" }
trust_token = { path = "lib" }
