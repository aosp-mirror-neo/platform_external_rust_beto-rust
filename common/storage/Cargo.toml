[package]
name = "storage"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
log.workspace = true
directories = "5.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Add rusqlite for SQLite capabilities
[target.'cfg(not(target_os = "ios"))'.dependencies]
rusqlite = { version = "0.31.0", features = ["bundled"] } # Using bundled for easier deployment
# If you need async SQLite operations, consider sqlx instead or in addition
# sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }

[target.'cfg(target_os = "ios")'.dependencies]
rusqlite = { version = "0.31.0" } # Don't use bundled as it interfere's with ios's sqlite

[dev-dependencies]
env_logger = "0.11.7"

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
serde_json = "1.0"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6.1"
objc2-foundation = { version = "0.3.1", features = [
    "NSUserDefaults",
    "NSString",
    "NSArray",
] }

[lints]
workspace = true

[features]
test-fake = []
